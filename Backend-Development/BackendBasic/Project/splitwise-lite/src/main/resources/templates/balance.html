<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><title>Balance</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container py-4">
    <h2>Balance for <span th:text="${user.name}"></span></h2>

    <h5 class="text-danger mt-3">You owe:</h5>
    <ul class="list-group mb-3">
        <li th:each="d : ${debts}" class="list-group-item">
            You owe <strong th:text="${d.creditor.name}"></strong>
            → ₹<span th:text="${d.amount}"></span>
            <span class="text-muted small" th:text="'(' + ${d.group.name} + ')'"></span>
        </li>
        <li th:if="${#lists.isEmpty(debts)}" class="list-group-item text-muted">
            Nothing owed!
        </li>
    </ul>

    <h5 class="text-success">Owed to you:</h5>
    <ul class="list-group mb-3">
        <li th:each="c : ${credits}" class="list-group-item">
            <strong th:text="${c.debtor.name}"></strong> owes you
            → ₹<span th:text="${c.amount}"></span>
            <span class="text-muted small" th:text="'(' + ${c.group.name} + ')'"></span>
        </li>
        <li th:if="${#lists.isEmpty(credits)}" class="list-group-item text-muted">
            No one owes you.
        </li>
    </ul>

    <a href="/balance" class="btn btn-secondary">← Back</a>
    <a href="/" class="btn btn-primary">Home</a>
</div>
</body>
</html>
