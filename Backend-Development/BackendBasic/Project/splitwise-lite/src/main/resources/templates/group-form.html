<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>New Group</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container py-4" style="max-width:500px">
    <h2>Create New Group</h2>

    <form action="/group" method="post">
        <div class="mb-3">
            <label class="form-label">Group Name</label>
            <input type="text" name="name" class="form-control" required
                   placeholder="e.g. Goa Trip"/>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Members</label>
            <div th:each="user : ${users}" class="form-check">
                <input class="form-check-input" type="checkbox"
                       name="memberIds" th:value="${user.id}"
                       th:id="'user_' + ${user.id}"/>
                <label class="form-check-label" th:for="'user_' + ${user.id}"
                       th:text="${user.name}"></label>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Create Group</button>
        <a href="/" class="btn btn-secondary w-100 mt-2">Cancel</a>
    </form>
</div>
</body>
</html>
