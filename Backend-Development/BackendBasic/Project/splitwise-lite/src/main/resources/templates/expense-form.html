<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Splitwise Lite</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body class="bg-light">
<div class="container py-4">
    <h1 class="mb-4">💸 Splitwise Lite</h1>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="row">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">Groups</div>
                <div class="card-body">
                    <a href="/group/new" class="btn btn-primary btn-sm mb-2">+ New Group</a>
                    <ul class="list-group">
                        <li th:each="g : ${groups}" class="list-group-item d-flex justify-content-between">
                            <span th:text="${g.name}"></span>
                            <form th:action="@{/group/{id}/delete(id=${g.id})}" method="post">
                                <button class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </li>
                    </ul>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">Quick Actions</div>
                <div class="card-body">
                    <a href="/expense/new" class="btn btn-success mb-2">+ Add Expense</a><br/>
                    <a href="/balance" class="btn btn-info">View Balances</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
